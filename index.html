<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Fire Alarm</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
<!-- INDICATOR -->
<div class="indicator">
    <span class="status-indicator" id="fire-alarm-indicator"></span>
    <span class="label">Fire Alarm Status</span>
    <span class="status-indicator" id="intruder-alarm-indicator"></span>
    <span class="label">Intruder Alarm Status</span>
</div>

<!-- BUTTONS -->
<div class="activation-btn">
    <button type="button" id="fire-alarm-btn"class="standard-btn">Activate Fire Alarm</button>
</div>

<div class="activation-btn">
    <button type="button" id="intruder-alarm-btn" class="standard-btn">Activate Intruder Alarm</button>
</div>

<div class="activation-btn">
    <button type="button" id="dual-alarm-btn" class="standard-btn">Activate All Alarms</button>
</div>

<div class="submit-btn">
    <button type="button" id="submit-btn" class="standard-btn">Activate All Alarms</button>
</div>

<!-- KEYPAD -->
<div class="keypad-screen">
    <input type="text" id="keypad-input" class="screen-display" readonly placeholder="Enter Code">
</div>

<div class="keypad-container">
    <div><button type="button" class="keypad-btn">1</button></div>
    <div><button type="button" class="keypad-btn">2</button></div>
    <div><button type="button" class="keypad-btn">3</button></div>
    <div><button type="button" class="keypad-btn">4</button></div>
    <div><button type="button" class="keypad-btn">5</button></div>
    <div><button type="button" class="keypad-btn">6</button></div>
    <div><button type="button" class="keypad-btn">7</button></div>
    <div><button type="button" class="keypad-btn">8</button></div>
    <div><button type="button" class="keypad-btn">9</button></div>
    <div><button type="button" class="keypad-btn">#</button></div>
    <div><button type="button" class="keypad-btn">0</button></div>
    <div><button type="button" class="keypad-btn">*</button></div>
</div>

<script src="script.js"></script>
</body>
</html>
